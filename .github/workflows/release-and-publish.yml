name: Release and Publish

on:
  # This workflow triggers exactly when the changesets release PR (always
  # opened from branch changeset-release/<base-branch>) is merged into main -
  # i.e. only after that PR has been manually approved and merged.
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  # Workflow execution order:
  # 1. wait-for-ci - Waits for CI workflow to complete successfully
  # 2. release-and-publish - Creates GitHub release and publishes to NPM
  # 3. deploy - Deploys documentation to GitHub Pages
  # If any job fails, subsequent jobs are automatically skipped.

  wait-for-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # Required to check CI workflow status
    # Only proceed for a manual run, or the merge (not just close) of the
    # changesets release PR specifically - never any other PR into main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'changeset-release/main')
    steps:
      - name: Wait for CI workflow to complete
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: ci-success
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          intervalSeconds: 10
          timeoutSeconds: 600

  release-and-publish:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    environment: Publish Environment
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v7
        with:
          # pull_request events default to a synthetic test-merge commit;
          # pin explicitly to the commit that actually landed on main.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm ci
      
      - name: Get package version
        id: package-version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
      
      - name: Get latest changes from CHANGELOG
        id: changelog
        run: |
          # Extract the changes for the latest version
          LATEST_CHANGES=$(sed -n "/## ${{ steps.package-version.outputs.version }}/,/## [0-9]/p" CHANGELOG.md | sed '$d' | sed '1d')
          # Store the changes in a file to preserve newlines
          echo "$LATEST_CHANGES" > latest_changes.txt
          echo "changes_file=latest_changes.txt" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.changes_file }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build package for publishing
        run: pnpm build
      
      - name: Publish to NPM registry
        run: pnpm publish --no-git-checks --provenance --access public
        env:
          HUSKY: 0

  deploy:
    needs: release-and-publish
    permissions:
      contents: read
      pages: write
      id-token: write
    # Concurrency control prevents race conditions during GitHub Pages deployments.
    # - group: "pages" - Groups all Pages deployments together under a single concurrency group.
    #   Only one deployment from this group can run at a time.
    # - cancel-in-progress: false - When a new deployment is triggered while another is running,
    #   the new one will wait for the current deployment to complete instead of canceling it.
    #   This ensures each deployment finishes fully, preventing partial or corrupted documentation.
    # Example: If two releases happen in quick succession, the second deployment waits for
    # the first to complete before starting, ensuring Pages is always in a consistent state.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm ci
      - name: Generate documentation
        run: pnpm typedoc
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
